<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#182B52"/>
      <stop offset="55%" stop-color="#0A1730"/>
      <stop offset="100%" stop-color="#07101F"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#56E6D0"/>
      <stop offset="55%" stop-color="#32C7D5"/>
      <stop offset="100%" stop-color="#6878FF"/>
    </linearGradient>
    <linearGradient id="robot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C9D5E8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#102B3F"/>
      <stop offset="100%" stop-color="#061622"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- Premium app icon background -->
  <rect x="3" y="3" width="122" height="122" rx="30" fill="url(#bg)"/>

  <!-- Tech orbit -->
  <path d="M24 74 A43 43 0 1 1 95 97" fill="none" stroke="url(#ring)"
        stroke-width="5.5" stroke-linecap="round" opacity=".95"/>
  <circle cx="24" cy="74" r="3.5" fill="#54E5D0" filter="url(#glow)"/>
  <circle cx="95" cy="97" r="3.5" fill="#6B7CFF" filter="url(#glow)"/>

  <!-- Sparkles -->
  <path d="M96 25 l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z"
        fill="#7D8CFF" opacity=".95"/>
  <path d="M31 29 l1.6 4.2 4.2 1.6-4.2 1.6-1.6 4.2-1.6-4.2-4.2-1.6 4.2-1.6z"
        fill="#55E6D1"/>

  <!-- Robot -->
  <g filter="url(#shadow)">
    <!-- antenna -->
    <path d="M64 20 V15" stroke="#BFD0E6" stroke-width="3" stroke-linecap="round"/>
    <circle cx="64" cy="13" r="4.2" fill="#4DE3D0" filter="url(#glow)"/>

    <!-- ears -->
    <rect x="25" y="47" width="9" height="22" rx="4.5" fill="#C7D3E5"/>
    <rect x="94" y="47" width="9" height="22" rx="4.5" fill="#C7D3E5"/>

    <!-- head -->
    <rect x="29" y="27" width="70" height="58" rx="19" fill="url(#robot)"/>
    <rect x="34" y="33" width="60" height="45" rx="14" fill="url(#screen)"/>

    <!-- eyes -->
    <path d="M46 51 q5 -7 10 0" fill="none" stroke="#49E2D5" stroke-width="4"
          stroke-linecap="round"/>
    <path d="M72 51 q5 -7 10 0" fill="none" stroke="#49E2D5" stroke-width="4"
          stroke-linecap="round"/>

    <!-- smile -->
    <path d="M57 61 q7 8 14 0" fill="none" stroke="#49E2D5" stroke-width="3.5"
          stroke-linecap="round"/>

    <!-- body -->
    <path d="M43 83 Q64 77 85 83 L88 103 Q64 113 40 103 Z" fill="url(#robot)"/>
    <path d="M48 96 Q64 101 80 96" fill="none" stroke="#52DED5" stroke-width="2.5"
          stroke-linecap="round" opacity=".9"/>

    <!-- arms -->
    <path d="M41 87 Q31 88 29 98" fill="none" stroke="#D4DEEB" stroke-width="9"
          stroke-linecap="round"/>
    <path d="M87 87 Q97 88 99 98" fill="none" stroke="#D4DEEB" stroke-width="9"
          stroke-linecap="round"/>
  </g>

  <!-- tiny ITOM label -->
  <text x="64" y="119" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="7" font-weight="700" letter-spacing="1.5"
        fill="#A9B8D0">ITOM AI</text>
</svg>